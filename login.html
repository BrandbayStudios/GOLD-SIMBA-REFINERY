<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in — EventHub Zambia</title>
<meta name="description" content="Log in to EventHub to manage your saved vendors, planner or business profile.">
<meta name="theme-color" content="#063B2E">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Gloock&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="site-header"></div>
<main class="auth">
  <div class="auth-art">
    <img src="https://images.unsplash.com/photo-1519741497674-611481863552?q=80&w=1200&auto=format&fit=crop" alt="">
    <h2>Welcome back.</h2>
    <p>Pick up where you left off — your shortlist, planner and messages are waiting.</p>
    <div class="band" style="position:absolute;left:0;right:0;bottom:0"></div>
  </div>
  <div class="auth-form"><div>
    <h1 style="font-size:2.2rem">Log in</h1>
    <div class="seg" role="group" aria-label="Account type"><button type="button" aria-pressed="true" data-role="customer">I’m planning an event</button><button type="button" aria-pressed="false" data-role="vendor">I’m a vendor</button></div>
    <form id="login-form" novalidate>
      <div class="field"><label for="email">Email</label><input id="email" type="email" required autocomplete="email"><span class="err">Enter a valid email address.</span></div>
      <div class="field"><label for="password">Password</label><input id="password" type="password" required minlength="6" autocomplete="current-password"><span class="err">Password must be at least 6 characters.</span></div>
      <div class="row" style="justify-content:space-between;margin-bottom:18px"><label class="check"><input type="checkbox"> Keep me logged in</label><a href="contact.html?topic=password" style="font-size:.9rem">Forgot password?</a></div>
      <p class="field err" id="login-err" role="alert" style="color:var(--danger);display:none"></p>
      <button class="btn btn-primary btn-block" type="submit">Log in</button>
    </form>
    <p class="muted" style="text-align:center;margin-top:22px">New to EventHub? <a href="register.html">Create an account</a> · <a href="vendor-register.html">List your business</a></p>
  </div></div>
</main>
<script src="assets/js/api.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/main.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function () {
  var role = 'customer';
  document.querySelectorAll('[data-role]').forEach(function (b) { b.onclick = function () { role = b.dataset.role; document.querySelectorAll('[data-role]').forEach(function (x) { x.setAttribute('aria-pressed', x === b); }); }; });
  function go(u) { location.href = u.role === 'vendor' ? 'vendor-dashboard.html' : u.role === 'admin' ? 'admin-dashboard.html' : 'planner.html'; }
  document.getElementById('login-form').addEventListener('submit', function (e) {
    e.preventDefault(); if (!EH.validate(e.target)) return;
    var email = e.target.email.value, err = document.getElementById('login-err'), btn = e.target.querySelector('button[type=submit]');
    btn.disabled = true; btn.textContent = 'Logging in…'; err.style.display = 'none';
    EH_API.login(email, e.target.password.value).then(function (res) {
      EH_API.setToken(res.token); EH_API.setUser(res.user); if (res.vendor_profile) EH_API.setVendorProfile(res.vendor_profile); go(res.user);
    }).catch(function (x) {
      if (x.offline) { // demo mode: no API configured yet
        var u = { name: email.split('@')[0].replace(/[._]/g, ' '), email: email, role: /^admin@/i.test(email) ? 'admin' : role };
        EH_API.setUser(u); go(u); return;
      }
      btn.disabled = false; btn.textContent = 'Log in';
      err.textContent = x.status === 401 || x.status === 422 ? 'That email and password don’t match. Check them and try again.' : 'We couldn’t reach EventHub. Check your connection and try again.';
      err.style.display = 'block';
    });
  });
});
</script>
</body>
</html>
