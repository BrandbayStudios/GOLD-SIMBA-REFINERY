<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saved vendors | EventHub Zambia</title>
<meta name="description" content="Your shortlist of saved event vendors.">
<meta name="theme-color" content="#063B2E">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Gloock&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="site-header"></div>
<main>
<section class="page-head">
  <div class="wrap">
    <div class="crumbs"><a href="index.html">Home</a> / Saved vendors</div>
    <h1>Saved vendors</h1>
    <p id="fav-sub">Your shortlist. Compare prices and ratings, then contact your favourites.</p>
  </div>
</section>
<div class="band thin"></div>
<section class="section tight">
  <div class="wrap">
    <div id="compare-wrap" style="margin-bottom:36px"></div>
    <div class="v-grid" id="fav-grid"></div>
  </div>
</section>
</main>
<div id="site-footer"></div>
<script src="assets/js/api.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/main.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function () {
  function render() {
    var favs = EH.getFavs().map(EH_DATA.vendor).filter(Boolean);
    var grid = document.getElementById('fav-grid'), cmp = document.getElementById('compare-wrap');
    document.getElementById('fav-sub').textContent = favs.length ? 'You’ve saved ' + favs.length + (favs.length === 1 ? ' vendor' : ' vendors') + '. Compare them below, then get in touch.' : 'Your shortlist. Compare prices and ratings, then contact your favourites.';
    if (!favs.length) {
      cmp.innerHTML = '';
      grid.innerHTML = '<div class="empty" style="grid-column:1/-1"><i class="fa-regular fa-heart"></i><h3>No saved vendors yet</h3><p>Tap the heart on any vendor card to add it to your shortlist.</p><a class="btn btn-primary" href="vendors.html">Find vendors</a></div>';
      return;
    }
    cmp.innerHTML = '<h2 style="font-size:1.6rem">Side-by-side</h2><div class="table-wrap"><table><thead><tr><th>Vendor</th><th>Category</th><th>City</th><th>Rating</th><th>From</th><th></th></tr></thead><tbody>' +
      favs.map(function (v) { return '<tr><td><a href="vendor-profile.html?v=' + v.id + '"><b>' + EH.esc(v.name) + '</b></a></td><td>' + EH_DATA.category(v.cat).name + '</td><td>' + v.city + '</td><td><span class="rating"><i class="fa-solid fa-star"></i>' + v.rating.toFixed(1) + '</span></td><td class="price">' + EH.kwacha(v.price) + '<small>/' + v.unit + '</small></td><td><a class="btn btn-wa btn-sm" target="_blank" rel="noopener" href="https://wa.me/' + v.phone.replace(/\D/g, '') + '"><i class="fa-brands fa-whatsapp"></i> Message</a></td></tr>'; }).join('') + '</tbody></table></div>';
    grid.innerHTML = favs.map(EH.card).join('');
    EH.refreshFavs();
  }
  render();
  document.addEventListener('eh:favs', render);
});
</script>
</body>
</html>
