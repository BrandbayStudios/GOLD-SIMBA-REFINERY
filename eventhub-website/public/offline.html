<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#003d38">
<title>Offline | EventHub Zambia</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#050505;color:#fff;font-family:Helvetica,Arial,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
.mark{width:64px;height:64px;margin:0 auto 22px;border:2px solid #c8a84e;color:#e6cf83;display:flex;align-items:center;justify-content:center;font:700 26px Georgia,serif}
h1{font:700 30px "Times New Roman",serif;margin:0 0 10px}
p{color:rgba(255,255,255,.7);max-width:340px;margin:0 auto 24px;line-height:1.5}
button{background:#c8a84e;color:#111;border:0;border-radius:8px;padding:13px 24px;font-weight:700;font-size:15px}
</style>
</head>
<body>
<div>
    <div class="mark">EH</div>
    <h1>You're offline</h1>
    <p>EventHub needs an internet connection to show vendors and send requests. Check your connection and try again.</p>
    <button onclick="location.reload()">Try again</button>
</div>
</body>
</html>
