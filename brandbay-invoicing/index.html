<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BrandBay Invoicing</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Poppins:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><img src="logo-gold.png" alt="BrandBay Innovation Studio" width="1231" height="223"><small>Invoicing</small></div>
      <nav>
        <a href="#/dashboard" data-nav="dashboard">Dashboard</a>
        <a href="#/documents" data-nav="documents">Invoices &amp; quotes</a>
        <a href="#/clients" data-nav="clients">Clients</a>
        <a href="#/catalog" data-nav="catalog">Services &amp; prices</a>
        <a href="#/settings" data-nav="settings">Settings</a>
      </nav>
      <div class="sidebar-new">
        <p>Create new</p>
        <a class="btn btn-gold btn-block" href="#/new/invoice">+ Invoice</a>
        <a class="btn btn-ghost btn-block" href="#/new/quotation">+ Quotation</a>
        <a class="btn btn-ghost btn-block" href="#/new/proforma">+ Proforma</a>
        <a class="btn btn-ghost btn-block" href="#/new/receipt">+ Receipt</a>
      </div>
      <p class="sidebar-foot">Data is saved in this browser. Back it up from Settings.</p>
    </aside>
    <div class="main">
      <header class="topbar">
        <button class="menu-btn" type="button" id="menuBtn" aria-label="Open menu" aria-expanded="false"><span></span><span></span><span></span></button>
        <h1 id="pageTitle">Dashboard</h1>
        <div class="topbar-actions" id="topbarActions"></div>
      </header>
      <main id="app" class="content"></main>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
