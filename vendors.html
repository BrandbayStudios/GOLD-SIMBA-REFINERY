<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find vendors | EventHub Zambia</title>
<meta name="description" content="Search verified event vendors in Zambia by category, city, price and rating.">
<meta name="theme-color" content="#063B2E">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Gloock&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="site-header"></div>

<main>
<section class="page-head">
  <div class="wrap">
    <div class="crumbs"><a href="index.html">Home</a> / Find vendors</div>
    <h1 id="list-title">Find event vendors</h1>
    <p id="list-sub">Call or WhatsApp any vendor directly. Use the filters to narrow it down.</p>
  </div>
</section>
<div class="band thin"></div>

<section class="section tight">
  <div class="wrap listing">
    <aside class="filters" id="filters" aria-label="Filters">
      <h3>Category</h3>
      <div class="filter-scroll" id="f-cats"></div>
      <h3>City</h3>
      <div id="f-cities"></div>
      <h3>Minimum rating</h3>
      <div>
        <label class="check"><input type="radio" name="rating" value="0" checked> Any rating</label>
        <label class="check"><input type="radio" name="rating" value="4.5"> 4.5 and up</label>
        <label class="check"><input type="radio" name="rating" value="4.8"> 4.8 and up</label>
      </div>
      <h3>Other</h3>
      <label class="check"><input type="checkbox" id="f-verified"> Verified vendors only</label>
      <button class="btn btn-ghost btn-sm btn-block" id="f-clear" style="margin-top:18px">Clear all filters</button>
    </aside>

    <div>
      <div class="toolbar">
        <div class="searchbox"><i class="fa-solid fa-magnifying-glass"></i><label class="sr-only" for="q">Search vendors</label><input class="input" id="q" type="search" placeholder="Search by name or area, e.g. “Kabulonga”"></div>
        <button class="btn btn-ghost btn-sm filter-toggle" id="filter-toggle" aria-controls="filters" aria-expanded="false"><i class="fa-solid fa-sliders"></i> Filters</button>
        <label class="sr-only" for="sort">Sort by</label>
        <select class="input" id="sort">
          <option value="rating">Highest rated</option>
          <option value="reviews">Most reviewed</option>
          <option value="price-asc">Price: low to high</option>
          <option value="price-desc">Price: high to low</option>
          <option value="distance">Nearest first</option>
        </select>
      </div>
      <div class="chips" id="chips"></div>
      <p class="muted" id="count" aria-live="polite" style="margin-bottom:16px"></p>
      <div class="v-grid" id="results"></div>
    </div>
  </div>
</section>
</main>

<div id="site-footer"></div>
<script src="assets/js/api.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/main.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var D = EH_DATA, P = new URLSearchParams(location.search);
  var state = {
    cats: P.get('category') ? [P.get('category')] : [],
    cities: P.get('city') ? [P.get('city')] : [],
    rating: 0, verified: false, q: P.get('q') || '', sort: P.get('sort') || 'rating', event: P.get('event') || ''
  };
  var vendors = D.VENDORS.slice();

  document.getElementById('f-cats').innerHTML = D.CATEGORIES.map(function (c) {
    return '<label class="check"><input type="checkbox" data-cat="' + c.slug + '"> ' + c.name + '</label>';
  }).join('');
  document.getElementById('f-cities').innerHTML = D.CITIES.map(function (c) {
    return '<label class="check"><input type="checkbox" data-city="' + c + '"> ' + c + '</label>';
  }).join('');

  var q = document.getElementById('q'), sort = document.getElementById('sort');
  q.value = state.q; sort.value = state.sort;

  function syncInputs() {
    document.querySelectorAll('[data-cat]').forEach(function (i) { i.checked = state.cats.indexOf(i.dataset.cat) > -1; });
    document.querySelectorAll('[data-city]').forEach(function (i) { i.checked = state.cities.indexOf(i.dataset.city) > -1; });
    document.querySelector('input[name=rating][value="' + state.rating + '"]').checked = true;
    document.getElementById('f-verified').checked = state.verified;
  }

  function render() {
    var term = state.q.trim().toLowerCase();
    var list = vendors.filter(function (v) {
      if (state.cats.length && state.cats.indexOf(v.cat) < 0) return false;
      if (state.cities.length && state.cities.indexOf(v.city) < 0) return false;
      if (v.rating < state.rating) return false;
      if (state.verified && !v.verified) return false;
      if (term && (v.name + ' ' + v.area + ' ' + v.city + ' ' + ((D.category(v.cat) || {}).name || '')).toLowerCase().indexOf(term) < 0) return false;
      return true;
    });
    var s = state.sort;
    list.sort(function (a, b) {
      return s === 'price-asc' ? a.price - b.price : s === 'price-desc' ? b.price - a.price : s === 'reviews' ? b.count - a.count : s === 'distance' ? a.km - b.km : b.rating - a.rating || b.count - a.count;
    });

    var res = document.getElementById('results');
    res.innerHTML = list.length ? list.map(EH.card).join('') :
      '<div class="empty" style="grid-column:1/-1"><i class="fa-solid fa-magnifying-glass"></i><h3>No vendors match these filters</h3><p>Try another city, a lower rating, or clear the filters to see everyone.</p><button class="btn btn-primary" onclick="document.getElementById(\'f-clear\').click()">Clear all filters</button></div>';
    document.getElementById('count').textContent = list.length + (list.length === 1 ? ' vendor' : ' vendors') + ' found';

    var title = 'Find event vendors';
    if (state.cats.length === 1) title = D.category(state.cats[0]).name;
    if (state.cities.length === 1) title += ' in ' + state.cities[0];
    document.getElementById('list-title').textContent = title;
    if (state.event) document.getElementById('list-sub').textContent = 'Vendors ready for your ' + state.event + '. Save the ones you like and compare them later.';

    var chips = [];
    state.cats.forEach(function (c) { chips.push(['cats', c, D.category(c).name]); });
    state.cities.forEach(function (c) { chips.push(['cities', c, c]); });
    if (state.rating) chips.push(['rating', 0, state.rating + '★ and up']);
    if (state.verified) chips.push(['verified', false, 'Verified only']);
    document.getElementById('chips').innerHTML = chips.map(function (c, i) {
      return '<span class="chip">' + EH.esc(c[2]) + '<button aria-label="Remove filter ' + EH.esc(c[2]) + '" data-chip="' + i + '"><i class="fa-solid fa-xmark"></i></button></span>';
    }).join('');
    document.querySelectorAll('[data-chip]').forEach(function (b) {
      b.onclick = function () {
        var c = chips[+b.dataset.chip];
        if (Array.isArray(state[c[0]])) state[c[0]] = state[c[0]].filter(function (x) { return x !== c[1]; }); else state[c[0]] = c[1];
        syncInputs(); render();
      };
    });
    EH.refreshFavs();
  }

  document.getElementById('filters').addEventListener('change', function (e) {
    var t = e.target;
    if (t.dataset.cat) state.cats = [].map.call(document.querySelectorAll('[data-cat]:checked'), function (i) { return i.dataset.cat; });
    if (t.dataset.city) state.cities = [].map.call(document.querySelectorAll('[data-city]:checked'), function (i) { return i.dataset.city; });
    if (t.name === 'rating') state.rating = +t.value;
    if (t.id === 'f-verified') state.verified = t.checked;
    render();
  });
  document.getElementById('f-clear').onclick = function () { state.cats = []; state.cities = []; state.rating = 0; state.verified = false; state.q = ''; q.value = ''; syncInputs(); render(); };
  q.addEventListener('input', function () { state.q = q.value; render(); });
  sort.addEventListener('change', function () { state.sort = sort.value; render(); });
  var ft = document.getElementById('filter-toggle');
  ft.onclick = function () { var o = document.getElementById('filters').classList.toggle('open'); ft.setAttribute('aria-expanded', o); };

  syncInputs(); render();

  // Live data when the API is configured
  if (EH_API.enabled) {
    EH_API.vendors({ per_page: 100 }).then(function (r) {
      if (!r || !r.data || !r.data.length) return;
      vendors = r.data.map(function (x) {
        return { id: x.slug, name: x.business_name, cat: x.category && x.category.slug, city: x.location && x.location.name, area: x.area || '', km: x.distance_km || 0,
          rating: +x.rating_avg || 0, count: x.rating_count || 0, price: x.starting_price || 0, unit: 'event', verified: x.status === 'approved', featured: !!x.is_featured,
          img: x.cover_image_url || D.VENDORS[0].img, phone: x.phone || '' };
      });
      render();
    }).catch(function () {});
  }
});
</script>
</body>
</html>
